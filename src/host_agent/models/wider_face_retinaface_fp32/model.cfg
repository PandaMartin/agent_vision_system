# ============================================================
# 模型档案 —— 一个文件夹 = 一个完整模型
# 系统启动扫描 SD卡 /models/ 下所有含 model.cfg 的子目录
#
# 文件约定(四个文件缺一不可):
#   model.cfg        本配置
#   model.param.bin  ncnn二进制网络结构(ncnn2mem的副产物 .param.bin)
#   model.bin        ncnn权重(.bin)
#   labels.txt       类别名, 每行一个, 行号=类别号(检测时第0行=background)
#
# 字段说明:
#   name       显示名(缺省=文件夹名)     input_size 正方形输入边长
#   pixel      bgr|rgb|bgr2rgb            blob_in/out 来自ncnn2mem的 *_id.h
#   mean/norm  预处理: 先减均值, 再乘norm(1=不缩放)
#   post       classify|detect|retinaface
#   --- post=classify ---   topk 打印Top-K数
# ============================================================

name = WIDER FACE 人脸检测 · RetinaFace · 
input_size = 320
pixel = bgr2rgb
blob_in = 0
blob_out = 140
mean = 0,0,0
norm = 1,1,1
post = retinaface
topk = 3
channels = 3
score_th = 0.5
nms_iou_th = 0.4
max_keep = 32
blob_cls8 = 134
blob_bbox8 = 124
blob_lmk8 = 125
blob_cls16 = 137
blob_bbox16 = 127
blob_lmk16 = 128
blob_cls32 = 140
blob_bbox32 = 130
blob_lmk32 = 131
display_name = WIDER FACE 人脸检测 · RetinaFace · FP32 · 11-01 11:35
