# ============================================================
# 模型档案 —— 一个文件夹 = 一个完整模型
# 系统启动扫描 SD卡 /models/ 下所有含 model.cfg 的子目录
#
# 文件约定(四个文件缺一不可):
#   model.cfg        本配置
#   model.param.bin  ncnn二进制网络结构(ncnn2mem的副产物 .param.bin)
#   model.bin        ncnn权重(.bin)
#   labels.txt       类别名, 每行一个, 行号=类别号(检测时第0行=background)
#
# 字段说明:
#   name       显示名(缺省=文件夹名)     input_size 正方形输入边长
#   pixel      bgr|rgb 输入帧字节序       blob_in/out 来自ncnn2mem的 *_id.h
#   mean/norm  预处理: 先减均值, 再乘norm(1=不缩放)
#   post       classify|detect
#   --- post=classify ---   topk 打印Top-K数
# ============================================================

name = wider_face_ssdlite_int8
input_size = 300
pixel = bgr
blob_in = 0
blob_out = 231
mean = 127.5,127.5,127.5
norm = 0.00784314,0.00784314,0.00784314
post = detect
topk = 3
channels = 3
score_th = 0.5
nms_iou_th = 0.45
max_keep = 32
